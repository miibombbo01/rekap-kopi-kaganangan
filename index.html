<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Kopi Kaganangan</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HALAMAN 1: DASHBOARD UTAMA -->
  <div id="pageDashboard" class="page-container active">
    <header class="app-header">
      <div class="brand">
        <h2>Kopi Kaganangan</h2>
        <p>Kalkulator Audit Harian</p>
      </div>
      <div class="user-select">
        <select id="selectKaryawan">
          <option value="randi">Randi</option>
          <option value="karyawan2">Karyawan B</option>
        </select>
      </div>
    </header>

    <section class="date-bar">
      <div class="date-item done">16<br><span>Min</span></div>
      <div class="date-item alert">17<br><span>Sen</span></div>
      <div class="date-item active">18<br><span>Sel</span></div>
      <div class="date-item disabled">19<br><span>Rab</span></div>
      <div class="date-item disabled">20<br><span>Kam</span></div>
    </section>

    <main class="main-content">
      <!-- Tombol Bulat Besar -->
      <div class="action-container">
        <button id="btnHitung" class="btn-hitung-circle">
          <span>HITUNG</span>
        </button>
      </div>

      <!-- Board Summary Atas -->
      <div class="summary-grid">
        <div class="board-card">
          <div class="card-header">🥤 BOARD CUP <span class="badge" id="dashBadgeCup">OK</span></div>
          <div class="card-body-dash">
            <p>Terjual: <b id="dashCupTerjual">0 Reg | 0 Lrg</b></p>
            <p id="dashStatusCup">Status: Pas</p>
          </div>
        </div>

        <div class="board-card">
          <div class="card-header">💵 BOARD UANG <span class="badge" id="dashBadgeUang">OK</span></div>
          <div class="card-body-dash">
            <p>Uang Tas: <b id="dashUangTas">Rp 0</b></p>
            <p id="dashStatusUang">Status: Pas</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- HALAMAN 2: OVERLAY FULLSCREEN (ANIMASI MENYEBAR DARI TENGAH) -->
  <div id="pageAuditOverlay" class="overlay-page">
    <div class="overlay-header">
      <button id="btnTutup" class="btn-back">← Kembali</button>
      <h3>Form Audit & Detail Sirup</h3>
      <button id="btnSelesai" class="btn-save">Simpan</button>
    </div>

    <div class="overlay-content">
      <!-- Board Input Fisik & Kas Atas -->
      <div class="audit-top-grid">
        <div class="audit-box">
          <h4>🥤 Input Fisik Cup</h4>
          <div class="input-row-inline">
            <input type="number" id="sisaCupReg" placeholder="Sisa Reg">
            <input type="number" id="sisaCupLrg" placeholder="Sisa Lrg">
          </div>
        </div>
        <div class="audit-box">
          <h4>💵 Input Uang & QRIS</h4>
          <input type="number" id="inputUangTas" placeholder="Uang di Tas (Rp)">
          <input type="number" id="inputQRIS" placeholder="Nominal QRIS (Rp)">
          <input type="number" id="inputPengeluaran" placeholder="Kasbon/Pengeluaran (Rp)">
        </div>
      </div>

      <h4 class="section-title">🧪 Input Varian Sirup & Bahan</h4>

      <!-- Grid Daftar Semua Rasa Sirup -->
      <div class="syrup-list-grid" id="syrupContainer">
        <!-- Akan di-generate otomatis oleh JS untuk 8 rasa sirup -->
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active"><span class="icon">📋</span><span class="label">Rekap</span></button>
    <button class="nav-item"><span class="icon">📊</span><span class="label">Penjualan</span></button>
    <button class="nav-item"><span class="icon">⚙️</span><span class="label">Setting</span></button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
