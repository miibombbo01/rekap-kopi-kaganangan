<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopi Kaganangan - Rekap Harian</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="pageDashboard" class="page-container">
    
    <header class="app-header">
      <span class="time-status">09:41</span>
      <div class="header-right">
        <select id="selectKaryawan" class="select-user">
          <option value="randi">Randi</option>
          <option value="karyawan2">Shift 2</option>
        </select>
      </div>
    </header>

    <div class="month-bar">
      <div class="month-title">
        <span class="icon-cal">📅</span>
        <h2 id="monthYearText">Agustus 2026</h2>
      </div>
      <button class="btn-request">Audit +</button>
    </div>

    <!-- TANGGAL UTAMA HANYA 1 (DIGENERATE LEWAT JS) -->
    <div class="date-scroll-wrapper">
      <section class="date-strip" id="dateStripContainer">
        <!-- Generasi 30 tanggal oleh JS -->
      </section>
    </div>

    <div class="location-card">
      <div class="loc-info">
        <span class="pin-icon">📍</span>
        <div>
          <p class="loc-label">Cabang Outlet</p>
          <p class="loc-name">Kopi Kaganangan - Outlet Utama</p>
        </div>
      </div>
      <span class="badge-dist">Aktif</span>
    </div>

    <div class="hero-circle-container">
      <div class="outer-ring">
        <button id="btnHitung" class="btn-hitung-circle">
          <span>HITUNG</span>
        </button>
      </div>
    </div>

    <div class="summary-triple-grid">
      <div class="mini-board">
        <div class="icon-circle yellow">🥤</div>
        <p class="board-title">Cup Terjual</p>
        <p class="board-value" id="dashCupTerjual">0 Reg | 0 Lrg</p>
      </div>

      <div class="mini-board">
        <div class="icon-circle red">💵</div>
        <p class="board-title">Uang Tas</p>
        <p class="board-value" id="dashUangTas">Rp 0</p>
      </div>

      <div class="mini-board">
        <div class="icon-circle blue">📊</div>
        <p class="board-title">Status Audit</p>
        <p class="board-value status-ok" id="dashStatusAudit">Aman</p>
      </div>
    </div>

    <div class="status-banner">
      <span>🏠 Shift Hari Ini: Kopi & Creamy Ready</span>
    </div>

  </div>

  <!-- OVERLAY AUDIT -->
  <div id="pageAuditOverlay" class="overlay-page">
    <div class="overlay-header">
      <!-- Tombol Kembali berupa lingkaran panah -->
      <button id="btnTutup" class="btn-back-circle">←</button>
      
      <!-- Hapus judul h3 di atas agar langsung form -->
      <div></div> 
      
      <button id="btnSelesai" class="btn-save">Simpan</button>
    </div>

    <div class="overlay-content">
      <h3 class="form-main-title">Form Audit & Detail Sirup</h3>

      <div class="audit-top-grid">
        <div class="audit-box">
          <h4>🥤 Input Fisik Cup</h4>
          <div class="input-row-inline">
            <input type="number" id="sisaCupReg" inputmode="numeric" placeholder="Sisa Reg">
            <input type="number" id="sisaCupLrg" inputmode="numeric" placeholder="Sisa Lrg">
          </div>
        </div>
        <div class="audit-box">
          <h4>💵 Input Uang & QRIS</h4>
          <input type="number" id="inputUangTas" inputmode="numeric" placeholder="Uang di Tas (Rp)">
          <input type="number" id="inputQRIS" inputmode="numeric" placeholder="Nominal QRIS (Rp)">
          <input type="number" id="inputPengeluaran" inputmode="numeric" placeholder="Kasbon/Pengeluaran (Rp)">
        </div>
      </div>

      <h4 class="section-title">Input Varian Sirup & Bahan</h4>
      <div class="syrup-list-grid" id="syrupContainer"></div>
    </div>
  </div>

  <div class="bottom-nav-wrapper">
    <nav class="floating-nav">
      <button class="nav-btn active"><span>🏠</span></button>
      <button class="nav-btn"><span>📅</span></button>
      <button class="nav-btn center-btn"><span>+</span></button>
      <button class="nav-btn"><span>📊</span></button>
      <button class="nav-btn"><span>👤</span></button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
